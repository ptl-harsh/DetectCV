<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DetectCV Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">DetectCV</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/attendance">Log</a></li>
      </ul>
      <form class="d-flex" method="POST" enctype="multipart/form-data">
        <input class="form-control me-2" type="file" name="file" accept=".jpg,.png" required>
        <button class="btn btn-light" type="submit">Upload Face</button>
      </form>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="row">
    <div class="col-lg-4">
      <div class="card">
        <div class="card-header bg-secondary text-white">Settings</div>
        <div class="card-body">
          <label for="cameraSelect" class="form-label">Camera Source</label>
          <select id="cameraSelect" class="form-select">
            <option value="0" {% if camera==0 %}selected{% endif %}>Camera 0</option>
            <option value="1">Camera 1</option>
            <option value="2">Camera 2</option>
          </select>
          <label for="tolerance" class="form-label mt-3">Tolerance: <span id="tolVal">{{ tolerance }}</span></label>
          <input id="tolerance" type="range" class="form-range" min="0.3" max="0.8" step="0.01" value="{{ tolerance }}">
        </div>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header bg-secondary text-white">Live Feed</div>
        <div class="card-body text-center">
          <img id="stream" class="img-fluid rounded shadow-sm" src="/video_feed?cam={{ camera }}&tol={{ tolerance }}" alt="Live Feed">
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
