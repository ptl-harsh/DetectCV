<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attendance Log</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Attendance Log</h1>
  <a href="/download" class="btn btn-success mb-2">Download CSV</a>
  <a href="/clear" class="btn btn-danger mb-2">Clear Log</a>
  <table class="table table-striped">
    <thead><tr><th>Name</th><th>Time</th></tr></thead>
    <tbody>{% for name,time in records %}
      <tr><td>{{name}}</td><td>{{time}}</td></tr>
    {% endfor %}</tbody>
  </table>
</div>
</body>
</html>
